<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css"> 
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
  <div style="
    display: flex; 
    flex-direction: column; 
    padding: 10px; 
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); 
    align-items: center;
    border: 2px rgba(125, 179, 255, 0.519) solid;
    border-radius: 10px;
  ">
    <div style="background-color: rgba(178, 209, 252, 0.519); border-top-left-radius: 10px; border-top-right-radius: 10px; padding: 10px;">
      <h2 style="font-size: 30px;">Logg inn på PC Utlån Portalen</h2>
    </div>

    <form id="loginForm" style="display: flex; flex-direction: column; padding-top: 20px; gap: 20px">
      <div style="display: flex; flex-direction: row; align-items: center; gap: 10px;">
        <div style="display: flex; flex-direction: column;  gap: 30px">
          <label style="padding-right: 10px;">Mail</label>
          <label style="padding-right: 10px;">Passord</label>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div class="inputs" style="display: flex; flex-direction: row; border-radius: 10px; border: 2px rgb(136, 134, 157) solid ;">
            <div style="
              border-top-left-radius: 8.6px; 
              border-bottom-left-radius: 8.6px; 
              padding: 10px; 
              padding-bottom: 0px; 
              background-color: rgba(204, 225, 255, 0.644);
              border-right: 1px solid rgb(136, 134, 157);"><img src="icons/person_icon.png" style="width: 15px; height: 15px;">
            </div>
            <input id="email" placeholder="Email" style="
              width: 250px; 
              height: 30px; 
              border-top-right-radius: 10px;
              border-bottom-right-radius: 10px;
              border: none;
              background-color: rgba(178, 209, 252, 0.644);
            ">
          </div>
          
          <div class="inputs" style="display: flex; flex-direction: row; border-radius: 10px; border: 2px rgb(136, 134, 157) solid;">
            <div style="
              border-top-left-radius: 8.6px; 
              border-bottom-left-radius: 8.6px; 
              padding: 10px; 
              padding-bottom: 0px; 
              background-color: rgba(204, 225, 255, 0.644);
              border-right: 1px solid rgb(136, 134, 157);"><img src="icons/key_icon.png" style="width: 15px; height: 15px;"></div>
            <input id="password" type="password" placeholder="Passord" style="
              width: 250px; 
              height: 30px; 
              border-top-right-radius: 10px;
              border-bottom-right-radius: 10px;
              border: none;
              background-color: rgba(178, 209, 252, 0.644);
            ">
          </div>
        </div>
      </div>

      <button class="submitButton" type="submit">Logg Inn</button>
    </form>
    
      <p style="font-size: 20px">Glemt passord? <a href="/forgot-password.html">Klikk her</a></p>

    <p id="msg"></p>

    <div style="
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      margin-bottom: 10px; 
      padding-bottom: 30px;
      background-color: rgba(178, 209, 252, 0.519);
      height: fit-content;
      width: 95%;
      border-radius: 10px;
      border: 2px rgba(125, 179, 255, 0.519) solid;
    ">
      <p>Ingen konto?</p>
      <a href="/register.html" style="
        color: inherit;
        text-decoration: inherit;
        background-color: rgb(255, 191, 0);
        border-radius: 10px;
        border: 2px black solid;
        padding: 10px;
      ">Registrer deg</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault(); // prevent page reload

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        document.getElementById("msg").textContent = data.error;
        return;
      }

      window.location.href = "/";
    });
  </script>
</body>
</html>
