<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
        <div style="
            display: flex; 
            flex-direction: column; 
            padding: 10px; 
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); 
            align-items: center;
            border: 2px rgba(125, 179, 255, 0.519) solid;
            border-radius: 10px;
            gap: 20px;
        ">
            <div style="background-color: rgba(178, 209, 252, 0.519); border-top-left-radius: 10px; border-top-right-radius: 10px; padding: 10px; width: 100%; box-sizing: border-box; display: flex; justify-content: center;">
                <h2 style="font-size: 30px;">Glemt Passord</h2>
            </div>

            <form onSubmit="handleSubmit(event)">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
                    <input
                    class="inputs"
                    type="email"
                    id="email"
                    placeholder="Email..."
                    required
                    style="
                        width: 250px; 
                        height: 30px; 
                        border-radius: 10px;
                        border: 2px rgb(136, 134, 157) solid;
                        background-color: rgba(178, 209, 252, 0.644);
                    "/>
                    <button class="submitButton" type="submit">Endre passord</button>
                </div>
            </form>

            <div id="msgDiv" style="display: none; border: 3px solid rgba(178, 209, 252, 0.644); border-radius: 7px;">
                <p id="msg" style="background-color: rgba(178, 209, 252, 0.644); border-radius: 4px; margin: 3px"></p>
            </div>
        </div>
        <script>
            async function handleSubmit(e) {
                e.preventDefault();

                const email = document.getElementById("email").value;

                const res = await fetch("/request-reset", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (!res.ok) {
                    document.getElementById("msgDiv").style.display = "block";
                    document.getElementById("msg").textContent = data.message;
                    return;
                }

                document.getElementById("msgDiv").style.display = "block";
                document.getElementById("msg").textContent = data.message;
            }
        </script>
    </body>
</html>
