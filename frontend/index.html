  <script>
    document.addEventListener("visibilitychange", async() => {
      console.log("Visibility changed: ", document.visibilityState);

        const signal = controller.signal;

        fetch("/health")
        .then(res => {

                console.log("Server unavailable");
            }
        })
        .catch(err => {
            console.log("Health check failed:", err);
        });

        setTimeout(() => controller.abort(), 1000);

    })

    function closeForm() {
      document.getElementById("requestPopup").style.display = "none";

    async function load() {
      let erLånt = false;
      const me = await fetch("/me", { credentials: "include" }).then(r => r.json());
      if (!me) {
        location.href = "/login.html";
        return;
      }

      if (me.role === "admin") {
        document.getElementById("dashboardBtn").style.display = "block";
        document.getElementById("lånBtn").style.display = "block";
        document.getElementById("adminBtn").style.display = "block";
        document.getElementById("calendarBtn").style.display = "block";
        document.getElementById("listPage").style.display = "flex";
        document.getElementById("loanStatus").style.display = "none";
      }

      await loadLoanStatus();

      const avail = await fetch("/availability").then(r => r.json());
      document.getElementById("available").textContent = avail.available;

      if (avail.available === 0) {
        /* document.getElementById("foresprørselDiv").style.display = "none";
        document.getElementById("aktivLåntDiv").style.display = "flex";
        document.getElementById("LåntOverskrift").textContent = "Ingen PC-er tilgjengelig for utlån";
        erLånt = true; */

        const alert = document.createElement("img");
        alert.src = "icons/alert_icon.png";
        alert.style = "width: 25px; height: 25px;";
        document.getElementById("alertDiv").appendChild(alert);
      }


      const ren = await fetch("/rentals-front", {
        credentials: "include",
      });
      const rentals = await ren.json();

      rentals.forEach(r => {
          if (r.status !== "returned") {
            const today = new Date();
            const todayString = today.toISOString().split("T")[0];
            const returnDate = r.return_date;
            const returnDateString = new Date(returnDate).toISOString().split("T")[0];
            if (returnDateString === todayString) {
              document.getElementById("aktivLåntDiv").style.display = "flex";
              const mainThing = document.getElementById("LåntOverskrift");
              mainThing.textContent = "Du har en PC som skal returneres i dag. Husk å returnere den.";
              mainThing.style = "background-color: red; font-size: 28px;";
              document.getElementById("pcLånt").textContent = `PC nummer: ${r.pc_number}`;
              document.getElementById("returDato").textContent = `Retur dato: ${new Date(r.return_date).toLocaleDateString()}`;
              erLånt = true;
            } else if (returnDateString < todayString) {
              document.getElementById("aktivLåntDiv").style.display = "flex";
              const mainThing = document.getElementById("LåntOverskrift");
              mainThing.textContent = "DU HAR GLEMT Å RETURNERE PC. RETURNER SÅ SNART SOM MULIG.";
              mainThing.style = "background-color: darkred; font-size: 28px;";
              document.getElementById("pcLånt").textContent = `PC nummer: ${r.pc_number}`;
              document.getElementById("returDato").textContent = `Retur dato: ${new Date(r.return_date).toLocaleDateString()}`;
              erLånt = true;
            } else {
              document.getElementById("aktivLåntDiv").style.display = "flex";
              document.getElementById("LåntOverskrift").textContent = "Du har allerede lånt en PC og kan ikke låne en ny";
              document.getElementById("pcLånt").textContent = `PC nummer: ${r.pc_number}`;
              document.getElementById("returDato").textContent = `Retur dato: ${new Date(r.return_date).toLocaleDateString()}`;
              erLånt = true;
            }
          }
      });

      /* requests.forEach(req => {
        if (req.notice_decline) {
          kill(req.id);
          console.log("DEN BURDE DØ!!.");
        } else {
            if (req.status === "pending") {
              document.getElementById("aktivLåntDiv").style.display = "flex";
              document.getElementById("LåntOverskrift").textContent = "Du har allerede sendt inn en forespørsel og kan ikke sende inn en ny";
              document.getElementById("pcLånt").textContent = `Forespørsel sendt inn`;
              document.getElementById("returDato").textContent = `Venter på godkjenning`;
              erLånt = true;
            }
            if (req.status === "declined") {
              document.getElementById("aktivLåntDiv").style.display = "flex";
              document.getElementById("LåntOverskrift").textContent = "Din forespørsel har blitt avslått";
              requestDenied(req.id);
            }
        }
      }); */

      const res = await fetch("/activeRequests", {
          credentials: "include"
      });
      const requests = await res.json();

      if (requests.length > 0 ) {
        const alert = document.createElement("img");
        alert.src = "icons/adminAlert_icon.png";
        alert.style = "width: 15px; height: 15px;";
        document.getElementById("adminAlert").appendChild(alert);
      }

      /* if (!erLånt) {
        document.getElementById("foresprørselDiv").style.display = "flex";
      } */

      document.getElementById("next").textContent =
        avail.nextAvailableDate
          ? new Date(avail.nextAvailableDate).toLocaleDateString()
          : "N/A";
    }

    async function kill(id) {
      await fetch("/kill-the-neighbors-dog", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ id })
      });
    }

    async function requestDenied(id) {
      await fetch("/remove-request", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ id })
      });
    };

    async function requestLoan() {
      const popup = document.getElementById("requestPopup").style.display = "block";
    };

    async function loadLoanStatus() {
      const loanStatusTitle = document.getElementById("loanStatusTitle");
      const loanStatusInfo = document.getElementById("loanStatusInfo");
      const loanPageButton = document.getElementById("loanPageButton");

      // Get this user's rentals
      const rentalResponse = await fetch("/rentals-front", {
          credentials: "include"
      });

      const rentals = await rentalResponse.json();

      // Get this user's requests
      const requestResponse = await fetch("/requests", {
          credentials: "include"
      });

      const requests = await requestResponse.json();


      // ==========================================
      // 1. CHECK IF THEY CURRENTLY HAVE A PC
      // ==========================================

      const activeRental = rentals.find(r => r.status === "active");

      if (activeRental) {

          loanStatusTitle.textContent = "Du har en PC utlånt";

          loanStatusInfo.innerHTML = `
            <div style="display: flex; flex-direction: row; width: 100%">
              <div id="miniCalendar" style="flex-basis: 50%; border: 2px solid blue; border-radius: 10px; margin: 10px; overflow: hidden; background-color: white;"></div>
              <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; flex-basis: 47%;">
                <p style="font-size: 35px; margin-bottom: 20px; font-weight: bold;">Utlån info</p>
                <p style="font-size: 25px;">PC nummer: <strong>${activeRental.pc_number}</strong></p>
                <p style="font-size: 25px;">Utlånt fra: <strong>${new Date(activeRental.rented_date).toLocaleDateString("no-NO")}</strong></p>
                <p style="font-size: 25px;">Returneres: <strong>${new Date(activeRental.return_date).toLocaleDateString("no-NO")}</strong></p>
              </div>
            </div>
          `;

          loanPageButton.style.display = "none";


          const returnDate =
            activeRental.return_date.split("T")[0];

          createMiniCalendar(returnDate);

          return;
      }


      // ==========================================
      // 2. CHECK FOR PENDING REQUEST
      // ==========================================

      const pendingRequest = requests.find(r => r.status === "pending");

      if (pendingRequest) {

          loanStatusTitle.textContent = "Forespørsel sendt";

          loanStatusInfo.innerHTML = `
              <p>
                  Du har sendt inn en forespørsel om å låne en PC.
              </p>

              <p>
                  Forespørselen må først vurderes av en administrator.
              </p>

              <p>
                  Ønsket periode:
                  <strong>
                      ${new Date(pendingRequest.start_date).toLocaleDateString("no-NO")}
                      -
                      ${new Date(pendingRequest.return_date).toLocaleDateString("no-NO")}
                  </strong>
              </p>
          `;

          loanPageButton.style.display = "none";

          return;
      }


      // ==========================================
      // 3. CHECK FOR DECLINED REQUEST
      // ==========================================

      const declinedRequest = requests.find(r => r.status === "declined");

      if (declinedRequest) {

          loanStatusTitle.textContent = "Forespørselen ble avslått";

          loanStatusInfo.innerHTML = `
              <p>
                  Forespørselen din om å låne en PC ble avslått.
              </p>

              <p>
                  Du kan sende inn en ny forespørsel dersom du ønsker.
              </p>
          `;

          loanPageButton.textContent = "Send ny forespørsel";
          loanPageButton.style.display = "inline-block";

          return;
      }


      // ==========================================
      // 4. NOTHING → THEY DON'T HAVE OR REQUEST PC
      // ==========================================

      loanStatusTitle.textContent = "Du har ingen aktiv PC";

      loanStatusInfo.innerHTML = `
          <p>
              Du har for øyeblikket ingen PC utlånt
              og ingen aktiv forespørsel.
          </p>

          <p>
              Hvis du ønsker å låne en PC,
              kan du sende inn en forespørsel.
          </p>
      `;

      loanPageButton.textContent = "Gå til Lån PC";
      loanPageButton.style.display = "inline-block";
    }

    let miniCalendar;

    function createMiniCalendar(returnDate) {

        const calendarElement = document.getElementById("miniCalendar");

        calendarElement.style.display = "block";

        // If the calendar already exists, destroy it first
        if (miniCalendar) {
            miniCalendar.destroy();
        }

        miniCalendar = new FullCalendar.Calendar(calendarElement, {

            initialView: "dayGridMonth",

            // This makes the calendar open on the month
            // containing the return date
            initialDate: returnDate,

            locale: "no",

            // Remove all navigation buttons
            headerToolbar: false,

            // Make it smaller
            height: "auto",


            // Highlight the return date
            events: [
                {
                    start: returnDate,
                    allDay: true,
                    display: "background",
                    backgroundColor: "rgba(255, 80, 80, 0.5)"
                }
            ]
        });

        miniCalendar.render();
    }

    load();
  </script>
