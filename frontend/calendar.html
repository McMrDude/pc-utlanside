<!DOCTYPE html> 
<html style="padding: 0; margin: 0;"> 
    <head> 
        <meta charset="utf-8"> 
        <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
        <title>Kalender</title> <meta name="description" content=""> 
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <link rel="stylesheet" href="style.css"> 
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet"> 
    </head> 
    <body> 
        <div class="navbar">
            <a class="navButtons" onclick="location.href='/index.html'">Dashboard</a>
            <a class="navButtons" onclick="location.href='/lån.html'">Lån PC</a>
            <a style="color: rgb(214, 214, 214); text-shadow: 2px 2px 3px rgba(0, 0, 0, 1);">Kalender</a>
            <a class="navButtons" style="position: relative" onclick="location.href='/admin.html'">Administrator
                <div id="adminAlert" style="
                top: -18%;
                right: -8%;
                position: absolute;
                padding: 0px;
                ">
                </div>
            </a>
            <a class="navButtons" onclick="logout()">Logg ut</a>
        </div>
        <div style="margin: 20px; display: flex; flex-direction: column;"> 
            <div id="calendar">

            </div>
        </div>
        <script src="oppdater_liste.js"></script> 
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script> 
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/locales-all.global.min.js"></script>
        <script>
            document.addEventListener("visibilitychange", async() => {
                console.log("Visibility changed: ", document.visibilityState);
                if (document.visibilityState === "visible") {
                    const controller = new AbortController();
                    const signal = controller.signal;

                    fetch("/health", { signal })
                    .then( response => response.json())
                    .catch ( err => {
                    if (err.name === "AbortError") {
                        console.log("Fetch aborted");
                        location.reload();
                    }
                    });

                    setTimeout(() => controller.abort(), 1000);
                }
            });

            async function load() {
                const res = await fetch("/activeRequests", {
                    credentials: "include"
                });
                const requests = await res.json();

                if (requests.length > 0 ) {
                    const alert = document.createElement("img");
                    alert.src = "icons/adminAlert_icon.png";
                    alert.style = "width: 15px; height: 15px;";
                    document.getElementById("adminAlert").appendChild(alert);
                }
            };

            load();
        </script>
        <script src="auth.js"></script>
    </body> 
</html>
