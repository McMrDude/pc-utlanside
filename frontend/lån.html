<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Lån PC</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="navbar">
            <div id="foresendt" style="position: fixed;">
                <h3>Forespørsel sendt</h3>
            </div>
            <button id="adminBtn" style="display: none;" onclick="location.href='/admin.html'">
            Admin
            <div id="adminAlert" style="width: 60px;background-color: rgb(11, 115, 170); 
            padding: 5px; border-radius: 30px; position: absolute; 
            font-size: 10px; display: none">Forespørsel !</div>
            </button>
            <a class="navButtons" style="cursor: pointer; color: white;" onclick="location.href='/index.html'">Dashboard</a>
            <a style="color: rgb(214, 214, 214); text-shadow: 2px 2px 3px rgba(0, 0, 0, 1);">Lån PC</a>
            <a class="navButtons" style="cursor: pointer; color: white;" onclick="location.href='/calendar.html'">Kalender</a>
            <a class="navButtons" style="cursor: pointer; color: white;" onclick="location.href='/admin.html'">Administrator</a>
            <a class="navButtons" style="cursor: pointer; color: white;" onclick="logout()">Logg ut</a>
        </div>

        <div id="aktivLåntDiv">
            <div style="
                display: flex; 
                flex-direction: column;
                justify-content: center; 
                align-items: center;
                background-color: rgb(174, 174, 174);
                box-shadow: inset 0 0 10px black;
                padding: 10px;
            ">
                <p id="LåntOverskrift"></p>
                <h3 id="pcLånt"></h3>
                <h3 id="returDato"></h3>
            </div>
        </div>

        <h1 style="text-align: center;">For hvilken lengde vil du låne en PC?</h1>
        <div id="requestPopup">
            <div  style="
                background-color: rgb(248, 253, 255);
                border: 2px rgba(172, 202, 244, 0.519) solid;
                border-radius: 20px; 
                box-shadow: 0 5px 10px -6px black;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 1000;
                padding: 10px;
            ">
                <div class="requestLoan">
                    <h3 style="font-size: 30px;">Hvor lenge skal du låne PC for?</h3>
                    <form id="requestForm" style="display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px;">
                    <h3>Hente dato:</h3>
                    <input name="selectedDate" id="selectedDate">
                    <h3>Returnerings dato:</h3>
                    <input name="returnDate" id="returnDate">
                    <p id="msg"></p>
                    <button style="cursor: pointer;" type="submit">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
