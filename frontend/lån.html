<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Lån PC</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    </head>
    <body>
        <div class="navbar">
            <div id="foresendt" style="position: fixed;">
                <h3>Forespørsel sendt</h3>
            </div>
            <button id="adminBtn" style="display: none;" onclick="location.href='/admin.html'">
            Admin
            <div id="adminAlert" style="width: 60px;background-color: rgb(11, 115, 170); 
            padding: 5px; border-radius: 30px; position: absolute; 
            font-size: 10px; display: none">Forespørsel !</div>
            </button>
            <a class="navButtons" style="cursor: pointer; color: white;" onclick="location.href='/index.html'">Dashboard</a>
            <a style="color: rgb(214, 214, 214); text-shadow: 2px 2px 3px rgba(0, 0, 0, 1);">Lån PC</a>
            <a class="navButtons" style="cursor: pointer; color: white;" onclick="location.href='/calendar.html'">Kalender</a>
            <a class="navButtons" style="cursor: pointer; color: white;" onclick="location.href='/admin.html'">Administrator</a>
            <a class="navButtons" style="cursor: pointer; color: white;" onclick="logout()">Logg ut</a>
        </div>

        <div id="aktivLåntDiv">
            <div style="
                display: flex; 
                flex-direction: column;
                justify-content: center; 
                align-items: center;
                background-color: rgb(174, 174, 174);
                box-shadow: inset 0 0 10px black;
                padding: 10px;
            ">
                <p id="LåntOverskrift"></p>
                <h3 id="pcLånt"></h3>
                <h3 id="returDato"></h3>
            </div>
        </div>

        <h1 style="text-align: center;">For hvilken lengde vil du låne en PC?</h1>
        <div id="requestPopup">
            <div  style="
                background-color: rgb(248, 253, 255);
                border: 2px rgba(172, 202, 244, 0.519) solid;
                border-radius: 20px; 
                box-shadow: 0 5px 10px -6px black;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 1000;
                padding: 10px;
            ">
                <div class="requestLoan">
                    <h3 style="font-size: 25px;">Hvor lenge skal du låne PC for?</h3>
                    <form id="requestForm" style="display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px;">
                    <h3>Hente dato:</h3>
                    <input name="selectedDate" id="selectedDate">
                    <h3>Returnerings dato:</h3>
                    <input name="returnDate" id="returnDate">
                    <p id="msg"></p>
                    <button style="cursor: pointer;" type="submit">Send</button>
                    </form>
                </div>
            </div>
        </div>

        <script src="oppdater_liste.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/no.js"></script>

        <script>
    const selectDate = document.getElementById("selectedDate");
    flatpickr(selectDate, {
        altInput: true,
        altFormat: "d-m-Y",
        dateFormat: "Y-m-d",
        locale: "no"
    });
    const returnDate = document.getElementById("returnDate");

    flatpickr(returnDate, {
        altInput: true,
        altFormat: "d-m-Y",
        dateFormat: "Y-m-d",
        locale: "no"
    });
  </script>
  <script>
    document.addEventListener("visibilitychange", async() => {
      console.log("Visibility changed: ", document.visibilityState);
      if (document.visibilityState === "visible") {
        const controller = new AbortController();
        const signal = controller.signal;

        fetch("/health", { signal })
        .then( response => response.json())
        .catch ( err => {
          if (err.name === "AbortError") {
            console.log("Fetch aborted");
            location.reload();
          }
        });

        setTimeout(() => controller.abort(), 1000);
      }
    })

    function closeForm() {
      document.getElementById("requestPopup").style.display = "none";
      document.getElementById("requestForm").reset();
    }
    async function load() {
      let erLånt = false;
      const me = await fetch("/me", { credentials: "include" }).then(r => r.json());
      if (!me) location.href = "/login.html";

      /* if (me.role === "admin") {
        document.getElementById("adminBtn").style.display = "block";
      } */

      const avail = await fetch("/availability").then(r => r.json());
      document.getElementById("available").textContent = avail.available;

      if (avail.available === 0) {
        /* document.getElementById("foresprørselDiv").style.display = "none";
        document.getElementById("aktivLåntDiv").style.display = "flex";
        document.getElementById("LåntOverskrift").textContent = "Ingen PC-er tilgjengelig for utlån";
        erLånt = true; */

        const alert = document.createElement("img");
        alert.src = "icons/alert_icon.png";
        alert.style = "width: 25px; height: 25px;";
        document.getElementById("alertDiv").appendChild(alert);
      }


      const ren = await fetch("/rentals-front", {
        credentials: "include",
      });
      const rentals = await ren.json();

      rentals.forEach(r => {
        if (r.student_email === me.email) {
          if (r.status !== "returned") {
            const today = new Date();
            const todayString = today.toISOString().split("T")[0];
            const returnDate = r.return_date;
            const returnDateString = new Date(returnDate).toISOString().split("T")[0];
            if (returnDateString === todayString) {
              document.getElementById("foresprørselDiv").style.display = "none";
              document.getElementById("aktivLåntDiv").style.display = "flex";
              const mainThing = document.getElementById("LåntOverskrift");
              mainThing.textContent = "Du har en PC som skal returneres i dag. Husk å returnere den.";
              mainThing.style = "background-color: red; font-size: 28px;";
              document.getElementById("pcLånt").textContent = `PC nummer: ${r.pc_number}`;
              document.getElementById("returDato").textContent = `Retur dato: ${new Date(r.return_date).toLocaleDateString()}`;
              erLånt = true;
            } else if (returnDateString < todayString) {
              document.getElementById("foresprørselDiv").style.display = "none";
              document.getElementById("aktivLåntDiv").style.display = "flex";
              const mainThing = document.getElementById("LåntOverskrift");
              mainThing.textContent = "DU HAR GLEMT Å RETURNERE PC. RETURNER SÅ SNART SOM MULIG.";
              mainThing.style = "background-color: darkred; font-size: 28px;";
              document.getElementById("pcLånt").textContent = `PC nummer: ${r.pc_number}`;
              document.getElementById("returDato").textContent = `Retur dato: ${new Date(r.return_date).toLocaleDateString()}`;
              erLånt = true;
            } else {
              document.getElementById("foresprørselDiv").style.display = "none";
              document.getElementById("aktivLåntDiv").style.display = "flex";
              document.getElementById("LåntOverskrift").textContent = "Du har allerede lånt en PC og kan ikke låne en ny";
              document.getElementById("pcLånt").textContent = `PC nummer: ${r.pc_number}`;
              document.getElementById("returDato").textContent = `Retur dato: ${new Date(r.return_date).toLocaleDateString()}`;
              erLånt = true;
            }
          }
        }
      });

      const res = await fetch("/requests", {
        credentials: "include"
      });
      const requests = await res.json();

      requests.forEach(req => {
        if (req.notice_decline) {
          kill(req.id);
          console.log("DEN BURDE DØ!!.");
        } else {
          if (req.student_email === me.email) {
            if (req.status === "pending") {
              document.getElementById("foresprørselDiv").style.display = "none";
              document.getElementById("aktivLåntDiv").style.display = "flex";
              document.getElementById("LåntOverskrift").textContent = "Du har allerede sendt inn en forespørsel og kan ikke sende inn en ny";
              document.getElementById("pcLånt").textContent = `Forespørsel sendt inn`;
              document.getElementById("returDato").textContent = `Venter på godkjenning`;
              erLånt = true;
            }
            if (req.status === "declined") {
              document.getElementById("foresprørselDiv").style.display = "flex";
              document.getElementById("aktivLåntDiv").style.display = "flex";
              document.getElementById("LåntOverskrift").textContent = "Din forespørsel har blitt avslått";
              requestDenied(req.id);
            }
          }
        }
      });

      if (requests.length > 0 ) {
        document.getElementById("adminAlert").style.display = "block";
      }

      /* if (!erLånt) {
        document.getElementById("foresprørselDiv").style.display = "flex";
      } */

      document.getElementById("next").textContent =
        avail.nextAvailableDate
          ? new Date(avail.nextAvailableDate).toLocaleDateString()
          : "N/A";
    }

    async function kill(id) {
      await fetch("/kill-the-neighbors-dog", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ id })
      });
    }

    async function requestDenied(id) {
      await fetch("/remove-request", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ id })
      });
    };

    async function requestLoan() {
      const popup = document.getElementById("requestPopup").style.display = "block";
    };

    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      document.documentElement.classList.add("loading");
      e.preventDefault();
      const selectedDate = document.getElementById('selectedDate').value;
      const returnDate = document.getElementById('returnDate').value;
      console.log("select Date: ", selectedDate, " | ", "return Date: ", returnDate)

      const res = await fetch("/submit-date", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ selectedDate, returnDate })
      });

      const data = await res.json();

      if (!res.ok) {
        document.getElementById("msg").textContent = "Du må velge datoer";
        return;
      }
      else {
        document.getElementById("msg").textContent = "";
        const popup = document.getElementById("requestPopup").style.display = "none";
      }
      
      const foresendt = document.getElementById("foresendt");
      foresendt.classList.remove("foresendt");
      void foresendt.offsetWidth; // forces reflow
      foresendt.classList.add("foresendt");
      document.getElementById("requestForm").reset();
      await load();
      document.documentElement.classList.remove("loading");
    });

    load();
  </script>
  <script src="auth.js"></script>
    </body>
</html>
