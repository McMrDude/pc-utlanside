<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Lån PC</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    </head>
    <body>
        <div class="navbar">
            <!-- <div id="foresendt" style="position: fixed;">
                <h3>Forespørsel sendt</h3>
            </div> -->
            <a class="navButtons" onclick="location.href='/index.html'">Dashboard</a>
            <a style="color: rgb(214, 214, 214); text-shadow: 2px 2px 3px rgba(0, 0, 0, 1);">Lån PC</a>
            <a id="calendarBtn" class="navButtons" style="display: none;" onclick="location.href='/calendar.html'">Kalender</a>
            <a id="adminBtn" class="navButtons" style="display: none; position: relative" onclick="location.href='/admin.html'">Administrator
              <div id="adminAlert" style="
                top: -18%;
                right: -8%;
                position: absolute;
                padding: 0px;
              ">
              </div>
            </a>
            <a class="navButtons" onclick="logout()">Logg ut</a>
        </div>

        <div id="aktivLåntDiv">
            <div style="
                display: flex; 
                flex-direction: column;
                justify-content: center; 
                align-items: center;
                background-color: rgb(174, 174, 174);
                box-shadow: inset 0 0 10px black;
                padding: 10px;
            ">
                <p id="LåntOverskrift"></p>
                <h3 id="pcLånt"></h3>
                <h3 id="returDato"></h3>
            </div>
        </div>

        <h2 style="text-align: center;">PC utlån</h2>
        <div id="requestPopup">
            <div  style="
                background-color: rgb(248, 253, 255);
                border: 2px rgba(172, 202, 244, 0.519) solid;
                border-radius: 20px; 
                box-shadow: 0 5px 10px -6px black;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 1000;
                padding: 10px;
            ">
                <div class="requestLoan">
                    <h3 style="font-size: 25px;">Hvor lenge skal du låne PC for?</h3>
                    <form id="requestForm" style="display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px;">
                      <h3>Hente dato:</h3>
                      <input name="selectedDate" id="selectedDate">
                      <h3>Returnerings dato:</h3>
                      <input name="returnDate" id="returnDate">
                      <p id="msg"></p>
                      <button style="cursor: pointer;" type="submit">Send</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- <script src="oppdater_liste.js"></script> -->

        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/no.js"></script>

        <script>
    const selectDate = document.getElementById("selectedDate");
    flatpickr(selectDate, {
        altInput: true,
        altFormat: "d-m-Y",
        dateFormat: "Y-m-d",
        locale: "no"
    });
    const returnDate = document.getElementById("returnDate");

    flatpickr(returnDate, {
        altInput: true,
        altFormat: "d-m-Y",
        dateFormat: "Y-m-d",
        locale: "no"
    });
  </script>
  <script>
    document.addEventListener("visibilitychange", async() => {
      console.log("Visibility changed: ", document.visibilityState);
      if (document.visibilityState === "visible") {
        const controller = new AbortController();
        const signal = controller.signal;

        fetch("/health", { signal })
        .then( response => response.json())
        .catch ( err => {
          if (err.name === "AbortError") {
            console.log("Fetch aborted");
            location.reload();
          }
        });

        setTimeout(() => controller.abort(), 1000);
      }
    })

    function closeForm() {
      document.getElementById("requestPopup").style.display = "none";
      document.getElementById("requestForm").reset();
    }
    async function load() {
      const me = await fetch("/me", {
          credentials: "include"
      }).then(r => r.json());

      if (!me) {
          location.href = "/login.html";
          return;
      }

      // Show admin navigation if the logged-in user is an admin
      if (me.role === "admin") {
          document.getElementById("adminBtn").style.display = "block";
          document.getElementById("calendarBtn").style.display = "block";
      }

      const res = await fetch("/activeRequests", {
          credentials: "include"
      });
      const requests = await res.json();

      if (requests.length > 0 ) {
          const alert = document.createElement("img");
          alert.src = "icons/adminAlert_icon.png";
          alert.style = "width: 15px; height: 15px;";
          document.getElementById("adminAlert").appendChild(alert);
      }
    }

    async function kill(id) {
      await fetch("/kill-the-neighbors-dog", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ id })
      });
    }

    async function requestDenied(id) {
      await fetch("/remove-request", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ id })
      });
    };

    async function requestLoan() {
      const popup = document.getElementById("requestPopup").style.display = "block";
    };

    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      document.documentElement.classList.add("loading");
      e.preventDefault();
      const selectedDate = document.getElementById('selectedDate').value;
      const returnDate = document.getElementById('returnDate').value;
      console.log("select Date: ", selectedDate, " | ", "return Date: ", returnDate)

      const res = await fetch("/submit-date", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({ selectedDate, returnDate })
      });

      const data = await res.json();

      if (!res.ok) {
        document.getElementById("msg").textContent = "Du må velge datoer";
        return;
      }
      else {
        document.getElementById("msg").textContent = "";
        const popup = document.getElementById("requestPopup").style.display = "none";
      }
      
      /* const foresendt = document.getElementById("foresendt");
      foresendt.classList.remove("foresendt");
      void foresendt.offsetWidth; // forces reflow
      foresendt.classList.add("foresendt"); */
      document.getElementById("requestForm").reset();
      console.debug("This fires before await load")
      await load();
      console.debug("This fires after await load")
      document.documentElement.classList.remove("loading");
      window.location.replace("/index.html");
    });

    load();
  </script>
  <script src="auth.js"></script>
    </body>
</html>
