                    <button class="overlayBackground" id="overlayBackground" onclick="getElementById('acceptRequest').classList.remove('is-visible'); getElementById('editPC').classList.remove('is-visible'); getElementById('overlayBackground').classList.remove('is-visible')"></button>

                    <div class="acceptRequest" id="acceptRequest">
                        <form onsubmit="approveRequest(event)">
                            <button type="button" class="close-btn" style="position: absolute; top: 10px; right: 10px;" onclick="getElementById('acceptRequest').classList.remove('is-visible'); getElementById('overlayBackground').classList.remove('is-visible')">X</button>
                            <h3>Velg PC</h3>

                            <select id="pcSelect" name="pc_number"></select>

                            <button type="submit" onclick="document.getElementById('acceptRequest').style.display = 'none';">Lagre</button>
                        </form>
                    </div>


                    <div id="editPC" class="editPC">
                        <form class="editForm" onsubmit="savePC(event)">
                            <button type="button" class="close-btn" style="position: absolute; top: 10px; right: 10px;" onclick="getElementById('editPC').classList.remove('is-visible'); getElementById('overlayBackground').classList.remove('is-visible')">X</button>
                            <h3>Rediger PC</h3>
                            <div style="display: grid; grid-template-columns: auto auto auto; gap: 10px;">
                                <h3 style="padding: 5px;">PC-nr:</h3>
                                <h3 style="padding: 5px;">Serienummer:</h3>
                                <h3 style="padding: 5px;">Modell:</h3>
                                <input id="editPcNumber" name="pc_number">
                                <input id="editSerieNumber" name="serie_number">
                                <input id="editPcModel" name="model">
                            </div>
                            <button type="submit">Lagre</button>
                        </form>
                    </div>

        <script>
            document.addEventListener("visibilitychange", async() => {
                console.log("Visibility changed: ", document.visibilityState);
                if (document.visibilityState === "visible") {
                    const controller = new AbortController();
                    const signal = controller.signal;

                    fetch("/health", { signal })
                    .then( response => response.json())
                    .catch ( err => {
                    if (err.name === "AbortError") {
                        console.log("Fetch aborted");
                        location.reload();
                    }
                    });

                    setTimeout(() => controller.abort(), 1000);
                }
            });
        </script>
