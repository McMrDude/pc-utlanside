<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Reset Passord</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
        <div style="
            display: flex; 
            flex-direction: column; 
            padding: 10px; 
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); 
            align-items: center;
            border: 2px rgba(125, 179, 255, 0.519) solid;
            border-radius: 10px;
            gap: 20px;
        ">
            <div style="background-color: rgba(178, 209, 252, 0.519); border-top-left-radius: 10px; border-top-right-radius: 10px; padding: 10px; width: 100%; box-sizing: border-box; display: flex; justify-content: center;">
                <h2 style="font-size: 30px;">Reset Passord</h2>
            </div>

            <form onSubmit="handleSubmit(event)">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
                    <div>
                        <input class="inputs"
                        type="password"
                        placeholder="Nytt passord..."
                        id="password"
                        required
                        style="
                            width: 250px; 
                            height: 30px; 
                            border-radius: 10px;
                            border: 2px rgb(136, 134, 157) solid;
                            background-color: rgba(178, 209, 252, 0.644);
                        "/>

                        <input class="inputs"
                        type="password"
                        placeholder="Bekreft nytt passord..."
                        id="confirmPassword"
                        required
                        style="
                            width: 250px; 
                            height: 30px; 
                            border-radius: 10px;
                            border: 2px rgb(136, 134, 157) solid;
                            background-color: rgba(178, 209, 252, 0.644);
                        "/>
                    </div>

                    <button class="submitButton" type="submit">Set nytt passord</button>
                </div>
            </form>

            <p id="msg"></p>
        </div>
        
        <script>
            const handleSubmit = async (e) => {
                e.preventDefault();

                const token = window.location.pathname.split("/").pop();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                console.log(window.location.pathname);
                console.log(token);

                try {
                const res = await fetch("/reset-password", {
                    method: "POST",
                    headers: {
                    "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                    token,
                    newPassword: password,
                    confirmPassword: confirmPassword
                    })
                });

                const data = await res.json();

                console.log("STATUS:", res.status);
                console.log("DATA:", data);

                if (!res.ok) {
                    document.getElementById("msg").textContent = 
                        data.error || data.message || "Noe gikk galt";
                    return;
                }

                window.location.replace("../login.html");

                document.getElementById("msg").textContent = data.message;
                } catch (error) {
                console.error(error);
                document.getElementById("msg").textContent = "Noe gikk galt.";
                }
            };
        </script>
    </body>
</html>
